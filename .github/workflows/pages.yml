name: Publish Agnes Studio to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate public Agnes backend URL
        env:
          AGNES_BACKEND_URL: ${{ vars.AGNES_BACKEND_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = os.environ.get("AGNES_BACKEND_URL", "").strip()
          parsed = urlparse(url)
          if not url or parsed.scheme != "https" or not parsed.netloc or parsed.username or parsed.password:
              raise SystemExit("AGNES_BACKEND_URL must be configured as a public HTTPS backend URL before publishing Pages.")
          print("Public backend URL syntax validated (backend availability must still be tested separately).")
          PY
      - name: Build original Agnes Vue frontend
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          # Public backend URL only. Never put AGNES_API_KEY in VITE_*.
          VITE_AGNES_BACKEND_URL: ${{ vars.AGNES_BACKEND_URL }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
